<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Track My Shorties</title><style>:root{--b:#351811;--g:#d8b35d;--bg:#ead7a1;--c:#fff2cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg),#f6e7ba);font-family:Arial,sans-serif;color:var(--b)}.box{width:min(92%,620px);background:var(--c);padding:38px;border-radius:32px;box-shadow:0 30px 70px #35181125}h1{font-size:44px;margin:0 0 8px}.lookup{display:flex;gap:8px;margin:25px 0}.lookup input{flex:1;padding:14px;border:2px solid #35181122;border-radius:99px;background:white}.lookup button{border:0;border-radius:99px;padding:0 20px;background:var(--b);color:var(--c);font-weight:800}.status{background:var(--b);color:var(--c);border-radius:24px;padding:28px;margin-top:20px}.status h2{font-size:30px;margin:0 0 8px}.steps{display:flex;justify-content:space-between;margin-top:24px;gap:5px}.step{height:8px;flex:1;border-radius:9px;background:#ffffff30}.step.on{background:var(--g)}a{color:inherit}</style></head><body><div class='box'><a href='index.html'>← SHORT & SWEET</a><h1>Track my Shorties.</h1><p>Enter your order number to see what your little troublemakers are doing.</p><div class='lookup'><input id='id' value='SS1042' placeholder='Order number'><button onclick='show()'>Track</button></div><div id='result'></div></div><script>
const defaults=[{id:'SS1042',name:'Sara',status:'new'},{id:'SS1043',name:'Maya',status:'baking'}];const copy={new:['Order received!','We got your order! 🤎'],accepted:["YAY! It's accepted ✨",'Your Shorties have officially entered the queue.'],baking:['Shorties getting made! 🍪','Chocolatey business is happening right now.'],delivery:['Shorties are running your way! 🏃🍪','They have left the kitchen and are coming for you.'],delivered:['Shorties have landed! 🤎','Enjoyyy — try not to finish them all at once.']};const rank={new:0,accepted:1,baking:2,delivery:3,delivered:4};function orders(){return JSON.parse(localStorage.getItem('ss_orders')||JSON.stringify(defaults))}function show(){let id=document.getElementById('id').value.trim().toUpperCase(),o=orders().find(x=>x.id===id),r=document.getElementById('result');if(!o){r.innerHTML='<p>Hmm… we can’t find that order. Check the number and try again.</p>';return}let c=copy[o.status]||copy.new;r.innerHTML=`<div class='status'><small>ORDER #${o.id}</small><h2>${c[0]}</h2><p>${c[1]}</p><div class='steps'>${[0,1,2,3,4].map(i=>`<span class='step ${i<=rank[o.status]?'on':''}'></span>`).join('')}</div></div>`}show();setInterval(show,3000);
</script></body></html>
