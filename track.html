<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track My Shorties — Short & Sweet</title>
<script src="config.js"></script>
<style>
:root{--brown:#351811;--gold:#d8b35d;--beige:#ead7a1;--cream:#fff2cf;--muted:#7b6258}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--beige),#f6e7ba);font-family:Arial,sans-serif;color:var(--brown)}
.wrap{width:min(92%,760px);margin:0 auto;padding:44px 0 70px}.back{display:inline-block;margin-bottom:30px;font-weight:800;text-decoration:none;color:var(--brown)}
.card{background:var(--cream);padding:38px;border-radius:32px;box-shadow:0 30px 70px #35181125}h1{font-size:clamp(38px,8vw,58px);line-height:.95;margin:0 0 12px;letter-spacing:-2px}
.lead{font-size:18px;line-height:1.6;color:#5f443b}.lookup{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:28px 0}.lookup input{min-width:0;padding:15px 18px;border:2px solid #35181122;border-radius:999px;background:white;font-size:16px}.lookup button{border:0;border-radius:999px;padding:0 24px;background:var(--brown);color:var(--cream);font-weight:900;cursor:pointer}
.message{padding:17px 20px;border-radius:18px;background:#fff8e8;margin-top:18px;line-height:1.5}.status{background:var(--brown);color:var(--cream);border-radius:26px;padding:28px;margin-top:20px}.status-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.status h2{font-size:31px;margin:8px 0}.paid{background:var(--gold);color:var(--brown);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:25px 0 10px}.step{height:8px;border-radius:9px;background:#ffffff30}.step.on{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:9px;text-align:center;opacity:.7}.meta{margin-top:18px;padding-top:18px;border-top:1px solid #ffffff22;font-size:14px;line-height:1.7}.muted{opacity:.7}
@media(max-width:650px){.card{padding:26px}.lookup{grid-template-columns:1fr}.lookup button{padding:14px}.labels{display:none}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← SHORT & SWEET</a>
<div class="card">
<h1>Track my Shorties.</h1>
<p class="lead">Enter your order number and the same phone number used when ordering.</p>
<div class="lookup">
<input id="id" placeholder="Order number e.g. SS123456" autocomplete="off">
<input id="phone" placeholder="Phone number" autocomplete="tel">
<button onclick="show()">Track</button>
</div>
<div id="result"></div>
</div>
</div>

<script>
const API=(window.SHORT_SWEET_API||"").replace(/\/$/,"");
const copy={
received:["Order received! 🤎","We have your order and are waiting for payment confirmation."],
paid:["Payment confirmed 🤎","Your payment is confirmed and your order is ready for acceptance."],
accepted:["YAY! Your order’s been accepted ✨","Your Shorties have officially entered the queue."],
baking:["Your Shorties are getting made! 🍪","Chocolatey business is happening right now."],
ready:["Your Shorties are dressed & ready 🤎","Everything is packed and ready for the next step."],
delivery:["Your Shorties are running your way! 🏃🍪","They have left the kitchen and are coming for you."],
delivered:["Shorties have landed. Enjoyyy! 🤎","Delivered! Try not to finish them all at once."],
cancelled:["Order cancelled","Please contact Short & Sweet if you need help."]
};
const rank={paid:0,accepted:1,baking:2,ready:3,delivery:4,delivered:5};
const labels=["Paid","Accepted","Baking","Ready","On the way","Delivered"];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function result(html){document.getElementById("result").innerHTML=html}
async function show(){
  const id=document.getElementById("id").value.trim().toUpperCase();
  const phone=document.getElementById("phone").value.trim();
  if(!id||!phone){result('<div class="message">Enter both your order number and phone number.</div>');return}
  if(!API){result('<div class="message">The live tracking system has not been connected yet.</div>');return}
  result('<div class="message">Checking your order...</div>');
  try{
    const res=await fetch(API+"/orders/"+encodeURIComponent(id)+"?phone="+encodeURIComponent(phone));
    const o=await res.json();
    if(!res.ok)throw new Error(o.error||"Order not found.");
    const state=copy[o.status]?o.status:"received", c=copy[state];
    if(!o.paid){
      result('<div class="status"><div class="status-top"><div><small>ORDER #'+esc(o.order_number)+'</small><h2>'+c[0]+'</h2><p>'+c[1]+'</p></div><span class="paid">PAYMENT PENDING</span></div><div class="meta"><div><b>Total:</b> AED '+esc(o.total_aed)+'</div><div class="muted">Tracking stages unlock after payment is confirmed.</div></div></div>');
      return;
    }
    const pos=rank[state]??0;
    const itemText=(o.items||[]).map(x=>x.qty+" × "+x.name).join(", ");
    result('<div class="status"><div class="status-top"><div><small>ORDER #'+esc(o.order_number)+'</small><h2>'+c[0]+'</h2><p>'+c[1]+'</p></div><span class="paid">PAID ✓</span></div><div class="steps">'+labels.map((_,i)=>'<span class="step '+(i<=pos?'on':'')+'"></span>').join("")+'</div><div class="labels">'+labels.map(x=>'<span>'+x+'</span>').join("")+'</div><div class="meta"><div><b>Order:</b> '+esc(itemText)+'</div><div><b>Total:</b> AED '+esc(o.total_aed)+'</div></div></div>');
  }catch(e){result('<div class="message">'+esc(e.message||"We couldn’t find that order.")+'</div>')}
}
const p=new URLSearchParams(location.search);
if(p.get("order"))document.getElementById("id").value=p.get("order");
if(p.get("phone"))document.getElementById("phone").value=p.get("phone");
if(p.get("order")&&p.get("phone"))show();
</script>
</body>
</html>
