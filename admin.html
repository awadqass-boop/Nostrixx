<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Short & Sweet — Orders</title><style>
:root{--b:#351811;--g:#d8b35d;--bg:#ead7a1;--c:#fff2cf;--m:#6a5956}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--b)}header{background:var(--b);color:var(--c);padding:22px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:38px 24px}h1{font-size:48px;margin:0 0 8px}.sub{opacity:.75}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}.order{background:var(--c);padding:24px;border-radius:24px;box-shadow:0 10px 30px #35181118}.top{display:flex;justify-content:space-between;gap:12px}.badge{background:var(--g);padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800}.details{line-height:1.7;margin:15px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{border:0;border-radius:99px;padding:11px 14px;font-weight:800;cursor:pointer;background:#fff;color:var(--b)}.buttons button.active{background:var(--b);color:var(--c)}.note{font-size:12px;opacity:.65;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:38px}}</style></head><body>
<header><strong>SHORT & SWEET ✦ ADMIN</strong><a href='index.html' style='color:#fff2cf'>View shop</a></header><main><h1>Orders</h1><div class='sub'>Tap a status and the customer's tracker updates instantly on this device.</div><div id='orders' class='grid'></div></main>
<script>
const defaults=[{id:'SS1042',name:'Sara',phone:'+971 50 000 0000',items:'12 × Classic Shorties',total:'AED 100',status:'new'},{id:'SS1043',name:'Maya',phone:'+971 50 000 0001',items:'Mini Shorties Box',total:'AED 85',status:'baking'}];
const statuses=[['accepted','Accept order'],['baking','Start baking'],['delivery','Out for delivery'],['delivered','Delivered']];
function data(){return JSON.parse(localStorage.getItem('ss_orders')||JSON.stringify(defaults))}function save(x){localStorage.setItem('ss_orders',JSON.stringify(x));render()}
function setStatus(id,s){let x=data();x.find(o=>o.id===id).status=s;save(x)}
function render(){document.getElementById('orders').innerHTML=data().map(o=>`<div class='order'><div class='top'><div><b>Order #${o.id}</b><br><small>${o.name} · ${o.phone}</small></div><span class='badge'>${o.status.toUpperCase()}</span></div><div class='details'>${o.items}<br><b>${o.total}</b></div><div class='buttons'>${statuses.map(s=>`<button class='${o.status===s[0]?'active':''}' onclick="setStatus('${o.id}','${s[0]}')">${s[1]}</button>`).join('')}</div><div class='note'>Demo status controls. Real WhatsApp/SMS sending requires connecting a messaging provider.</div></div>`).join('')}render();
</script></body></html>
