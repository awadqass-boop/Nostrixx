<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short & Sweet — Orders Admin</title>
<script src="config.js"></script>
<style>
:root{--brown:#351811;--gold:#d8b35d;--beige:#ead7a1;--cream:#fff2cf;--muted:#6a5956}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--beige);color:var(--brown)}header{background:var(--brown);color:var(--cream);padding:22px 5%;display:flex;justify-content:space-between;gap:20px;align-items:center}header a{color:var(--cream);text-decoration:none}
main{max-width:1180px;margin:auto;padding:38px 24px 70px}h1{font-size:clamp(40px,6vw,62px);margin:0 0 6px;letter-spacing:-2px}.sub{opacity:.75;line-height:1.5}.panel{background:var(--cream);padding:24px;border-radius:26px;margin:24px 0;box-shadow:0 10px 30px #35181112}
.login{display:grid;grid-template-columns:1fr auto;gap:10px}.login input{padding:13px 14px;border:1px solid #35181122;background:white;border-radius:14px;font:inherit}.primary{border:0;background:var(--brown);color:var(--cream);padding:13px 17px;border-radius:999px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}.order{background:var(--cream);padding:24px;border-radius:24px;box-shadow:0 10px 30px #35181118}.top{display:flex;justify-content:space-between;gap:12px}.badge{background:var(--gold);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.unpaid{background:#ead8d1}.details{line-height:1.7;margin:15px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{border:0;border-radius:999px;padding:10px 12px;font-weight:800;cursor:pointer;background:#fff;color:var(--brown)}.buttons button.active{background:var(--brown);color:var(--cream)}.empty{padding:30px;background:#ffffff55;border-radius:20px;text-align:center}.small{font-size:12px;opacity:.7}.error{background:#ffe5df}
@media(max-width:760px){.grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>SHORT & SWEET ✦ ADMIN</strong><div><a href="index.html">Shop</a> &nbsp;·&nbsp; <a href="track.html">Tracker</a></div></header>
<main>
<h1>Orders</h1>
<div class="sub">This is your private order dashboard. Enter the admin key you created in Cloudflare, then load customer orders.</div>

<section class="panel">
<h2>Admin access</h2>
<div class="login"><input id="key" type="password" placeholder="Admin key"><button class="primary" onclick="loadOrders()">Load orders</button></div>
<p class="small">The key is kept only in this browser tab and is never stored in GitHub.</p>
</section>

<div id="message"></div>
<div id="orders" class="grid"></div>
</main>

<script>
const API=(window.SHORT_SWEET_API||"").replace(/\/$/,"");
const statuses=[["accepted","Accepted"],["baking","Baking"],["ready","Ready"],["delivery","Out for delivery"],["delivered","Delivered"],["cancelled","Cancelled"]];
let adminKey="";
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function msg(t,error=false){document.getElementById("message").innerHTML='<div class="panel '+(error?'error':'')+'">'+t+'</div>'}
async function loadOrders(){
  if(!API){msg("The online orders API is not connected yet.",true);return}
  adminKey=document.getElementById("key").value.trim();
  if(!adminKey){msg("Enter your admin key.",true);return}
  msg("Loading orders...");
  try{
    const res=await fetch(API+"/admin/orders",{headers:{"X-Admin-Key":adminKey}});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Could not load orders.");
    render(data.orders||[]);document.getElementById("message").innerHTML="";
  }catch(e){msg(esc(e.message||"Could not load orders."),true)}
}
async function updateOrder(id,body){
  try{
    const res=await fetch(API+"/admin/orders/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json","X-Admin-Key":adminKey},body:JSON.stringify(body)});
    const data=await res.json();if(!res.ok)throw new Error(data.error||"Update failed.");
    await loadOrders();
  }catch(e){msg(esc(e.message||"Update failed."),true)}
}
function render(orders){
  const root=document.getElementById("orders");
  if(!orders.length){root.innerHTML='<div class="empty">No customer orders yet.</div>';return}
  root.innerHTML=orders.map(o=>{
    const items=(o.items||[]).map(x=>x.qty+" × "+x.name).join(", ");
    return '<article class="order"><div class="top"><div><b>Order #'+esc(o.order_number)+'</b><br><small>'+esc(o.customer_name)+' · '+esc(o.phone)+'</small></div><span class="badge '+(o.paid?'':'unpaid')+'">'+(o.paid?'PAID ✓':'PAYMENT PENDING')+'</span></div><div class="details">'+esc(items)+'<br><b>AED '+esc(o.total_aed)+'</b><br><span class="small">'+esc(o.email||'')+(o.notes?'<br>Notes: '+esc(o.notes):'')+'</span></div><div class="buttons"><button onclick="updateOrder(\''+o.order_number+'\',{paid:'+(!o.paid)+',status:\''+(o.paid?o.status:'paid')+'\'})">'+(o.paid?'Mark unpaid':'Confirm payment')+'</button>'+statuses.map(s=>'<button class="'+(o.status===s[0]?'active':'')+'" onclick="updateOrder(\''+o.order_number+'\',{status:\''+s[0]+'\'})">'+s[1]+'</button>').join("")+'</div></article>';
  }).join("");
}
</script>
</body>
</html>
